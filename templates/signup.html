<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - TrueFace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eef5 50%, #f5f7fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Dot grid pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, rgba(102, 126, 234, 0.12) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        /* Face scan - left side */
        .bg-face-scan {
            position: fixed;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 380px;
            height: 480px;
            opacity: 0.16;
            z-index: 0;
            pointer-events: none;
            animation: floatLeft 8s ease-in-out infinite;
        }
        @keyframes floatLeft {
            0%, 100% { transform: translateY(-50%) translateX(0); }
            50% { transform: translateY(-50%) translateX(10px); }
        }

        /* Half-face split - right side */
        .bg-half-face {
            position: fixed;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 380px;
            height: 480px;
            opacity: 0.18;
            z-index: 0;
            pointer-events: none;
            animation: floatRight 9s ease-in-out infinite;
        }
        @keyframes floatRight {
            0%, 100% { transform: translateY(-50%) translateX(0); }
            50% { transform: translateY(-50%) translateX(-10px); }
        }

        /* Animated scan line */
        .bg-scanline {
            position: fixed;
            left: 0; top: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.5), rgba(118, 75, 162, 0.5), transparent);
            z-index: 1;
            pointer-events: none;
            animation: scanSweep 4s ease-in-out infinite;
        }
        @keyframes scanSweep {
            0% { top: -3px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Neural network */
        .bg-network {
            position: fixed;
            left: 0; top: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Corner brackets */
        .corner-deco {
            position: fixed;
            width: 120px; height: 120px;
            opacity: 0.22;
            z-index: 0;
            pointer-events: none;
        }
        .corner-deco.tl { top: 20px; left: 20px; }
        .corner-deco.tr { top: 20px; right: 20px; transform: scaleX(-1); }
        .corner-deco.bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
        .corner-deco.br { bottom: 20px; right: 20px; transform: scale(-1,-1); }

        .container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            padding: 45px 45px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
            width: 100%; max-width: 480px;
            animation: slideUp 0.8s ease-out;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(102, 126, 234, 0.1);
            max-height: 92vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo { text-align: center; margin-bottom: 35px; }
        .logo-icon { font-size: 52px; margin-bottom: 14px; display: block; animation: pulse 3s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .logo h1 { color: #1a1a2e; font-size: 30px; font-weight: 800; margin-bottom: 6px; letter-spacing: -1px; }
        .logo h1 span { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo p { color: #7f8c8d; font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 20px; animation: fadeInUp 0.6s ease-out both; }
        .form-group:nth-child(1) { animation-delay: 0.15s; }
        .form-group:nth-child(2) { animation-delay: 0.25s; }
        .form-group:nth-child(3) { animation-delay: 0.35s; }
        .form-group:nth-child(4) { animation-delay: 0.45s; }
        .form-group:nth-child(5) { animation-delay: 0.55s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
        .form-group label { display: block; margin-bottom: 10px; color: #2c3e50; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input { width: 100%; padding: 14px 18px; border: 2px solid #e8eef5; border-radius: 14px; font-size: 15px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); background: #f8fafc; color: #2c3e50; font-weight: 500; }
        .form-group input::placeholder { color: #bdc3c7; font-weight: 400; }
        .form-group input:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 5px rgba(102, 126, 234, 0.1); transform: translateY(-2px); }
        .password-hint { font-size: 12px; color: #95a5a6; margin-top: 10px; font-weight: 600; letter-spacing: 0.3px; }

        .btn { width: 100%; padding: 16px 20px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-top: 15px; box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3); animation: fadeInUp 0.6s ease-out 0.55s both; position: relative; overflow: hidden; }
        .btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: rgba(255,255,255,0.2); transition: left 0.4s ease; }
        .btn:hover::before { left: 100%; }
        .btn:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4); }
        .btn:active { transform: translateY(-1px); }

        .error { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); color: white; padding: 16px 18px; border-radius: 14px; margin-bottom: 20px; text-align: center; font-weight: 600; animation: shake 0.5s ease-in-out; box-shadow: 0 5px 20px rgba(255,107,107,0.3); border-left: 4px solid rgba(255,255,255,0.5); }
        .success { background: linear-gradient(135deg, #51cf66, #37b24d); color: white; padding: 16px 18px; border-radius: 14px; margin-bottom: 20px; text-align: center; font-weight: 600; box-shadow: 0 5px 20px rgba(81,207,102,0.3); border-left: 4px solid rgba(255,255,255,0.5); }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }

        .divider { display: flex; align-items: center; margin: 28px 0; opacity: 0.7; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1.5px; background: linear-gradient(90deg, transparent, #dde4ee, transparent); }
        .divider span { padding: 0 16px; color: #95a5a6; font-size: 12px; font-weight: 700; letter-spacing: 1px; }

        .links { text-align: center; animation: fadeInUp 0.6s ease-out 0.65s both; }
        .links p { color: #7f8c8d; font-size: 15px; margin: 0; font-weight: 500; }
        .links a { color: #667eea; text-decoration: none; font-weight: 800; transition: all 0.3s ease; position: relative; display: inline-block; }
        .links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 3px; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 2px; }
        .links a:hover { color: #764ba2; }
        .links a:hover::after { width: 100%; }
    </style>
</head>
<body>

<!-- Animated scan line -->
<div class="bg-scanline"></div>

<!-- Corner brackets -->
<svg class="corner-deco tl" viewBox="0 0 120 120" fill="none">
    <polyline points="0,40 0,0 40,0" stroke="#667eea" stroke-width="2.5" fill="none"/>
    <polyline points="0,30 0,10 20,10" stroke="#764ba2" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
    <circle cx="5" cy="5" r="3" fill="#667eea" opacity="0.6"/>
    <text x="12" y="55" fill="#667eea" font-size="7" font-family="monospace" opacity="0.7">ENROLL</text>
</svg>
<svg class="corner-deco tr" viewBox="0 0 120 120" fill="none">
    <polyline points="0,40 0,0 40,0" stroke="#667eea" stroke-width="2.5" fill="none"/>
    <circle cx="5" cy="5" r="3" fill="#e74c3c" opacity="0.6"/>
</svg>
<svg class="corner-deco bl" viewBox="0 0 120 120" fill="none">
    <polyline points="0,40 0,0 40,0" stroke="#667eea" stroke-width="2.5" fill="none"/>
    <circle cx="5" cy="5" r="3" fill="#667eea" opacity="0.6"/>
</svg>
<svg class="corner-deco br" viewBox="0 0 120 120" fill="none">
    <polyline points="0,40 0,0 40,0" stroke="#667eea" stroke-width="2.5" fill="none"/>
    <circle cx="5" cy="5" r="3" fill="#764ba2" opacity="0.6"/>
</svg>

<!-- Face Scan SVG - left side -->
<svg class="bg-face-scan" viewBox="0 0 200 260" fill="none">
    <polyline points="20,20 20,5 40,5" stroke="#667eea" stroke-width="2.5" fill="none"/>
    <polyline points="160,5 180,5 180,20" stroke="#667eea" stroke-width="2.5" fill="none"/>
    <polyline points="20,240 20,255 40,255" stroke="#667eea" stroke-width="2.5" fill="none"/>
    <polyline points="160,255 180,255 180,240" stroke="#667eea" stroke-width="2.5" fill="none"/>
    <ellipse cx="100" cy="120" rx="62" ry="80" stroke="#667eea" stroke-width="1.5"/>
    <ellipse cx="75" cy="105" rx="15" ry="8" stroke="#667eea" stroke-width="1"/>
    <ellipse cx="125" cy="105" rx="15" ry="8" stroke="#667eea" stroke-width="1"/>
    <circle cx="75" cy="105" r="5" fill="#667eea" opacity="0.25"/>
    <circle cx="125" cy="105" r="5" fill="#667eea" opacity="0.25"/>
    <path d="M 95 112 Q 100 138 105 112" stroke="#667eea" stroke-width="0.8" fill="none"/>
    <path d="M 80 150 Q 100 162 120 150" stroke="#667eea" stroke-width="1" fill="none"/>
    <line x1="30" y1="80" x2="170" y2="80" stroke="#667eea" stroke-width="0.5" stroke-dasharray="6,4"/>
    <line x1="30" y1="105" x2="170" y2="105" stroke="#667eea" stroke-width="0.5" stroke-dasharray="6,4"/>
    <line x1="30" y1="130" x2="170" y2="130" stroke="#667eea" stroke-width="0.5" stroke-dasharray="6,4"/>
    <line x1="30" y1="155" x2="170" y2="155" stroke="#667eea" stroke-width="0.5" stroke-dasharray="6,4"/>
    <circle cx="100" cy="120" r="22" stroke="#764ba2" stroke-width="0.5" stroke-dasharray="3,3">
        <animateTransform attributeName="transform" type="rotate" from="0 100 120" to="360 100 120" dur="12s" repeatCount="indefinite"/>
    </circle>
    <!-- Animated scanning bar -->
    <line x1="25" y1="50" x2="175" y2="50" stroke="#667eea" stroke-width="1.5" opacity="0.6">
        <animate attributeName="y1" values="50;210;50" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="50;210;50" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3s" repeatCount="indefinite"/>
    </line>
</svg>

<!-- Half-face split - right (Real vs Fake) -->
<svg class="bg-half-face" viewBox="0 0 220 280" fill="none">
    <!-- Outer frame -->
    <rect x="10" y="10" width="200" height="260" rx="8" stroke="#667eea" stroke-width="0.8" fill="none" stroke-dasharray="8,4"/>
    <!-- Left half - REAL (clean smooth lines) -->
    <path d="M 110 40 Q 50 55 45 120 Q 42 200 110 240" stroke="#667eea" stroke-width="1.5" fill="none"/>
    <ellipse cx="80" cy="107" rx="13" ry="7" stroke="#667eea" stroke-width="1"/>
    <circle cx="80" cy="107" r="4" fill="#667eea" opacity="0.2"/>
    <path d="M 67 95 Q 80 89 93 95" stroke="#667eea" stroke-width="0.6" fill="none"/>
    <path d="M 85 117 Q 95 140 100 117" stroke="#667eea" stroke-width="0.6" fill="none"/>
    <path d="M 85 157 Q 97 165 110 157" stroke="#667eea" stroke-width="0.8" fill="none"/>
    <!-- Left label -->
    <rect x="40" y="250" width="50" height="14" rx="3" fill="#667eea" opacity="0.15"/>
    <text x="48" y="260" fill="#667eea" font-size="9" font-family="monospace" font-weight="bold" opacity="0.8">REAL</text>
    <!-- Checkmark indicator -->
    <circle cx="65" cy="210" r="10" stroke="#27ae60" stroke-width="1" fill="none" opacity="0.5"/>
    <polyline points="59,210 63,215 72,205" stroke="#27ae60" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- Right half - FAKE (glitchy, pixelated, broken) -->
    <path d="M 110 40 L 115 55 L 168 58 L 166 85 L 175 120 L 172 155 L 165 192 L 148 218 L 110 240" stroke="#e74c3c" stroke-width="1.2" fill="none" stroke-dasharray="5,2"/>
    <!-- Glitch rectangles for eye -->
    <rect x="130" y="100" width="18" height="12" stroke="#e74c3c" stroke-width="0.8" fill="none"/>
    <rect x="133" y="103" width="5" height="5" fill="#e74c3c" opacity="0.15"/>
    <rect x="140" y="103" width="5" height="5" fill="#e74c3c" opacity="0.1"/>
    <!-- Glitch lines -->
    <line x1="115" y1="90" x2="170" y2="92" stroke="#e74c3c" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="120" y1="130" x2="165" y2="128" stroke="#e74c3c" stroke-width="0.5" stroke-dasharray="3,2"/>
    <path d="M 110 157 Q 125 168 145 152" stroke="#e74c3c" stroke-width="0.6" fill="none" stroke-dasharray="3,2"/>
    <!-- Pixel noise squares -->
    <rect x="150" y="72" width="4" height="4" fill="#e74c3c" opacity="0.2"/>
    <rect x="158" y="85" width="3" height="3" fill="#e74c3c" opacity="0.15"/>
    <rect x="142" y="175" width="5" height="5" fill="#e74c3c" opacity="0.12"/>
    <rect x="155" y="165" width="3" height="3" fill="#e74c3c" opacity="0.18"/>
    <rect x="130" y="190" width="4" height="4" fill="#e74c3c" opacity="0.1"/>
    <!-- Right label -->
    <rect x="130" y="250" width="50" height="14" rx="3" fill="#e74c3c" opacity="0.12"/>
    <text x="138" y="260" fill="#e74c3c" font-size="9" font-family="monospace" font-weight="bold" opacity="0.8">FAKE</text>
    <!-- Warning indicator -->
    <circle cx="155" cy="210" r="10" stroke="#e74c3c" stroke-width="1" fill="none" opacity="0.5"/>
    <text x="152" y="214" fill="#e74c3c" font-size="12" font-family="sans-serif" font-weight="bold" opacity="0.5">!</text>

    <!-- Center dividing line -->
    <line x1="110" y1="25" x2="110" y2="245" stroke="#764ba2" stroke-width="0.8" stroke-dasharray="8,4"/>
    <!-- VS badge -->
    <rect x="97" y="132" width="26" height="14" rx="4" fill="#764ba2" opacity="0.2"/>
    <text x="103" y="142" fill="#764ba2" font-size="8" font-family="monospace" font-weight="bold" opacity="0.7">VS</text>

    <!-- Animated scan -->
    <line x1="15" y1="40" x2="205" y2="40" stroke="#764ba2" stroke-width="1" opacity="0.4">
        <animate attributeName="y1" values="40;240;40" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="40;240;40" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
    </line>
</svg>

<!-- Neural network -->
<svg class="bg-network" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">
    <line x1="80" y1="120" x2="200" y2="200" stroke="#667eea" stroke-width="0.8" opacity="0.1"/>
    <line x1="200" y1="200" x2="350" y2="150" stroke="#667eea" stroke-width="0.8" opacity="0.1"/>
    <line x1="200" y1="200" x2="320" y2="350" stroke="#667eea" stroke-width="0.8" opacity="0.08"/>
    <line x1="700" y1="100" x2="850" y2="200" stroke="#764ba2" stroke-width="0.8" opacity="0.1"/>
    <line x1="850" y1="200" x2="900" y2="400" stroke="#764ba2" stroke-width="0.8" opacity="0.08"/>
    <line x1="600" y1="500" x2="750" y2="450" stroke="#667eea" stroke-width="0.8" opacity="0.08"/>
    <circle cx="80" cy="120" r="5" fill="#667eea" opacity="0.15"/>
    <circle cx="200" cy="200" r="6" fill="#667eea" opacity="0.15"/>
    <circle cx="350" cy="150" r="5" fill="#764ba2" opacity="0.15"/>
    <circle cx="700" cy="100" r="5" fill="#667eea" opacity="0.15"/>
    <circle cx="850" cy="200" r="6" fill="#764ba2" opacity="0.15"/>
    <circle cx="900" cy="400" r="5" fill="#667eea" opacity="0.12"/>
    <circle cx="600" cy="500" r="4" fill="#764ba2" opacity="0.12"/>
    <circle cx="750" cy="450" r="5" fill="#667eea" opacity="0.12"/>
</svg>

<div class="container">
    <div class="logo">
        <span class="logo-icon">🛡️</span>
        <h1><span>True</span>Face</h1>
        <p>Join Our Community</p>
    </div>

    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/signup">
        <div class="form-group">
            <label for="username">👤 Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a unique username" required>
        </div>
        <div class="form-group">
            <label for="email">✉️ Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>
        <div class="form-group">
            <label for="password">🔐 Password</label>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required minlength="6">
            <p class="password-hint">✓ Minimum 6 characters required</p>
        </div>
        <div class="form-group">
            <label for="confirm_password">🔐 Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
        </div>
        <button type="submit" class="btn">Create Account</button>
    </form>

    <div class="divider"><span>ALREADY A USER?</span></div>
    <div class="links"><p>Already have an account? <a href="/login">Log In Here</a></p></div>
</div>

</body>
</html>
