# TrueFace - Docker Compose Configuration
# Run with: docker-compose up --build

version: "3.8"

services:
  trueface:
    build: .
    container_name: trueface-app
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - TF_CPP_MIN_LOG_LEVEL=2
    volumes:
      # Persist uploaded images
      - ./uploads:/app/uploads
      # Persist SQLite database
      - ./backend/trueface.db:/app/backend/trueface.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

